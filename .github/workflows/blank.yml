name: Release Source Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - prod
      - uat

jobs:
  validate-source-branch:
    name: validate-source-branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR source branch
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          echo "============================================="
          echo "PR Branch Promotion Policy Check"
          echo "============================================="
          echo "Source Branch (HEAD): $HEAD"
          echo "Target Branch (BASE): $BASE"
          echo "============================================="

          case "$BASE" in

            prod)
              # Target prod: Only allows PRs from uat or hotfix/*
              if [[ "$HEAD" == "uat" ]] || [[ "$HEAD" =~ ^hotfix/.* ]]; then
                echo " Allowed: Merge into 'prod' is from '$HEAD'."
                exit 0
              fi
              ;;

            uat)
              # Target uat: Only allows PRs from dev or hotfix/*
              if [[ "$HEAD" == "dev" ]] || [[ "$HEAD" =~ ^hotfix/.* ]]; then
                echo " Allowed: Merge into 'uat' is from '$HEAD'."
                exit 0
              fi
              ;;

          esac

          echo " Branch '$HEAD' is NOT allowed to merge into '$BASE'."
          echo ""
          echo "Policy Rules:"
          echo "  - Target 'prod': Only allowed from 'uat' or 'hotfix/*'"
          echo "  - Target 'uat' : Only allowed from 'dev' or 'hotfix/*'"
          exit 1
